# Texts for the English version of the simulator (address: /simulatore-3d/en/)
# Words in braces, like {name}, are replaced by the simulator: leave them as they are.
lingua: en
locale: en-US
titolo: 3D print cost calculator
descrizione: Upload your STL, 3MF or G-code files and instantly get the weight, time and cost of a 3D print, filament or resin.
h1: 3D print cost calculator
sottotitolo: "Upload one or more STL, 3MF or G-code files and choose material, infill and supports for each: weight, print time and cost update instantly. With a G-code or a sliced 3MF, time and grams are the real ones from your slicer. Your files stay on your computer, because everything is analysed in the browser."
torna_al_sito: "← Back to site"
lingua_selettore: Language
caffe_risultato: "Was this useful? Buy me a coffee ☕"
caffe_piede: "☕ Buy me a coffee"

