# ===============================================================
#  Calcolatore stampa 3D: prezzi e parametri
#  Modifica i valori, salva (commit) e GitHub Pages ricostruisce il sito
#  in un paio di minuti. Importi in euro, IVA esclusa.
#  I decimali si scrivono con il punto: 1.80, non 1,80.
# ===============================================================

email_preventivi: l0r3nz0g4rb1@gmail.com   # dove arrivano le richieste di preventivo

# ---------- Costi ----------
# Il simulatore calcola il costo reale di stampa: materiale, usura della stampante, energia
# e, per la resina, lavaggio e polimerizzazione. Le voci di vendita qui sotto sono a zero.
costo_orario: 0.30          # € per ora di usura della stampante, usato solo se la lista "stampanti" è vuota
costo_energia_kwh: 0.30     # € per kWh: valore proposto nel campo "Energia" della pagina
potenza_w: 120              # consumo medio in stampa (W), usato solo se la lista "stampanti" è vuota
preparazione_ordine: 0      # € fissi per stampa (0 = nessuno)
ordine_minimo: 0            # importo minimo (0 = nessuno)
ricarico_percento: 0        # ricarico su materiale e usura (0 = costo reale)
scarto_percento: 5          # materiale perso in spurghi, skirt e prove
stampe_fallite_percento: 5  # costo in più per le stampe da rifare (valore proposto nel campo "Stampe fallite" della pagina)
iva_percento: 0             # 0 = nessuna IVA

# ---------- Valuta ----------
# Tutti gli importi di questo file sono in euro. Se il visitatore sceglie i dollari, il simulatore
# li converte con questo cambio (1 € = X $). Cambio di riferimento al 9 novembre 2026: 1,12.
cambio_eur_usd: 1.12

# ---------- Sconti quantità ----------
# Servono solo per vendere: per aggiungerli, vedi l'esempio commentato.
# sconti_quantita:
#   - da_pezzi: 10
#     sconto_percento: 5
sconti_quantita: []

# ---------- Materiali ----------
# densita in g/cm³, prezzo_kg in €/kg
# velocita rispetto al PLA: 1 = uguale, 0.5 = metà velocità
# colore: colore dell'anteprima 3D, in esadecimale tra virgolette
# descrizione: testo mostrato nella pagina (facoltativo)
# nome_en: nome nella versione inglese del simulatore (facoltativo: se manca si usa nome)
# Il primo materiale è quello proposto di default.
materiali:
  - nome: PLA
    descrizione: "Facile, preciso e con finitura pulita. Ideale per prototipi, modellini e oggetti d'arredo."
    densita: 1.24
    prezzo_kg: 25
    velocita: 1.0
    colore: "#E9E4DA"
  - nome: PETG
    descrizione: "Più resistente e un po' flessibile, sopporta meglio umidità e calore. Adatto a pezzi funzionali."
    densita: 1.27
    prezzo_kg: 28
    velocita: 0.9
    colore: "#7FB3CF"
  - nome: ABS
    descrizione: "Robusto e lavorabile dopo la stampa, regge temperature più alte del PLA."
    densita: 1.04
    prezzo_kg: 27
    velocita: 0.9
    colore: "#A9AEB6"
  - nome: ASA (per esterni)
    nome_en: ASA (outdoor)
    descrizione: "Simile all'ABS ma resiste ai raggi UV: la scelta giusta per i pezzi che stanno all'aperto."
    densita: 1.07
    prezzo_kg: 32
    velocita: 0.9
    colore: "#D8CDB4"
  - nome: TPU (flessibile)
    nome_en: TPU (flexible)
    descrizione: "Gommoso ed elastico: guarnizioni, protezioni, piedini antiscivolo."
    densita: 1.21
    prezzo_kg: 40
    velocita: 0.45
    colore: "#E5673E"

  # Resine (tecnologia: resina): compaiono solo con le stampanti a resina.
  # densita in g/ml, prezzo_kg in € per kg (le resine si vendono di solito in flaconi da 1 kg)
  - nome: Resina standard
    nome_en: Standard resin
    tecnologia: resina
    descrizione: "Dettaglio finissimo e superficie liscia: miniature, figure, gioielli da fusione."
    densita: 1.10
    prezzo_kg: 30
    colore: "#9AA3AE"
  - nome: Resina ABS-like
    nome_en: ABS-like resin
    tecnologia: resina
    descrizione: "Più tenace e meno fragile della standard, per pezzi che vengono maneggiati."
    densita: 1.10
    prezzo_kg: 38
    colore: "#5E6670"
  - nome: Resina lavabile in acqua
    nome_en: Water-washable resin
    tecnologia: resina
    descrizione: "Si lava con acqua invece che con alcol: pratica, con resa simile alla standard."
    densita: 1.10
    prezzo_kg: 35
    colore: "#C9B79C"
  - nome: Resina trasparente
    nome_en: Clear resin
    tecnologia: resina
    descrizione: "Trasparente dopo la lucidatura: lenti, diffusori, pezzi decorativi."
    densita: 1.12
    prezzo_kg: 40
    colore: "#CFE6EE"
  - nome: Resina tough
    nome_en: Tough resin
    tecnologia: resina
    descrizione: "Resistente agli urti, per pezzi meccanici con dettaglio fine."
    densita: 1.15
    prezzo_kg: 55
    colore: "#3E6F8E"

# ---------- Qualità di stampa ----------
# strato_mm: altezza dello strato per le stampanti a filamento
# strato_resina_mm: altezza dello strato per le stampanti a resina
# portata_mm3s: volume medio stampato al secondo, spostamenti inclusi.
#   Più è alta, più la stima del tempo è breve: calibrala confrontando
#   qualche stima con il tempo indicato dal tuo slicer.
qualita:
  - nome: Bozza
    nome_en: Draft
    strato_mm: 0.28
    strato_resina_mm: 0.10
    portata_mm3s: 9
  - nome: Standard
    nome_en: Standard
    strato_mm: 0.20
    strato_resina_mm: 0.05
    portata_mm3s: 6
    predefinita: true
  - nome: Fine
    nome_en: Fine
    strato_mm: 0.12
    strato_resina_mm: 0.03
    portata_mm3s: 3.5

# ---------- Stampante e limiti ----------
area_stampa_mm: [256, 256, 256]   # X, Y, Z; usata solo se la lista "stampanti" è vuota
max_file: 20                      # file per preventivo
max_mb_per_file: 80               # dimensione massima di ogni file

# ---------- Stima di peso e tempo ----------
spessore_pareti_mm: 0.8           # pareti e strati pieni (2 perimetri da 0.4 mm)
supporti_materiale_percento: 15   # materiale in più per i file con supporti
supporti_tempo_percento: 10       # tempo in più per i file con supporti
cambio_colore_spurgo_g: 0.8       # filamento spurgato a ogni cambio colore (AMS, MMU o cambio manuale)
cambio_colore_secondi: 60         # tempo di ogni cambio colore

# ---------- Stampa a resina ----------
resina_pareti_mm: 2.0                    # spessore delle pareti dei pezzi svuotati
resina_supporti_percento: 10             # resina in più per i pezzi con supporti
resina_post_lavorazione: 1.00            # € per ogni stampa (piatto) per lavaggio e polimerizzazione (alcol, guanti, carta)
resina_occupazione_piatto_percento: 60   # quanta parte del piatto si riempie davvero di pezzi
riscaldamento_minuti: 5           # per ordine
cambio_strato_secondi: 2

# ---------- Stampanti ----------
# Il cliente sceglie marca e modello della stampante e il simulatore usa i suoi parametri.
# Area di stampa, telaio aperto o chiuso e note tecniche vengono dai siti ufficiali di Bambu Lab,
# Prusa, Creality, Elegoo e Anycubic (novembre 2026); per le stampanti a più ugelli è indicata
# l'area massima. Le stampanti a telaio aperto accettano solo PLA, PETG e TPU.
# Costo orario (usura), consumo (potenza_w) e velocità sono stime: adattali alle tue macchine.
#   marca, nome:   il cliente sceglie prima la marca, poi il modello (nome)
#   area_stampa_mm: X, Y, Z in mm (i modelli più grandi vengono segnalati)
#   costo_orario:   € per ora di usura della macchina (ugelli, piatti, cinghie, pellicole FEP,
#                   eventuale ammortamento); l'energia è a parte
#   potenza_w:      consumo medio durante la stampa in watt (stima), per calcolare l'energia
#   velocita:       quanto è veloce rispetto alla portata delle qualità (1 = uguale, 1.5 = 50% più veloce);
#                   stimata da velocità e accelerazione massime dichiarate
#   chiusa:         true se la stampante è chiusa (adatta ad ABS e ASA)
#   materiali:      materiali che può stampare, con i nomi usati sopra (basta la prima parola).
#                   Se ometti la riga, la stampante accetta tutti i materiali.
#   note:           testo facoltativo mostrato sotto il menu
#   note_en:        la stessa nota per la versione inglese (facoltativa: se manca si usa note)
#   predefinita:    true per la stampante proposta all'apertura della pagina
#   tecnologia:     "resina" per le stampanti a resina (se manca: filamento). Per queste stampanti
#                   il tempo dipende dall'altezza del pezzo: secondi_strato = secondi per ogni strato
#                   (esposizione + sollevamento) con resina standard. costo_orario e velocita come sopra;
#                   la riga materiali non serve: si usano le resine dell'elenco materiali.
