# ===============================================================
#  Calcolatore stampa 3D: prezzi e parametri
#  Modifica i valori, salva (commit) e GitHub Pages ricostruisce il sito
#  in un paio di minuti. Importi in euro, IVA esclusa.
#  I decimali si scrivono con il punto: 1.80, non 1,80.
# ===============================================================

email_preventivi: l0r3nz0g4rb1@gmail.com   # dove arrivano le richieste di preventivo

# ---------- Prezzi ----------
costo_orario: 1.80          # € per ora di stampa, usato solo se la lista "stampanti" è vuota
preparazione_ordine: 5.00   # € fissi per ordine (slicing, preparazione, imballo)
ordine_minimo: 10.00        # € imponibile minimo per ordine
ricarico_percento: 30       # ricarico su materiale e tempo di stampa
scarto_percento: 5          # materiale perso in spurghi, skirt e prove
iva_percento: 22

# ---------- Sconti quantità (sul totale dei pezzi dell'ordine) ----------
# Vale la soglia più alta raggiunta. Per non applicare sconti: sconti_quantita: []
sconti_quantita:
  - da_pezzi: 10
    sconto_percento: 5
  - da_pezzi: 50
    sconto_percento: 10

# ---------- Materiali ----------
# densita in g/cm³, prezzo_kg in €/kg
# velocita rispetto al PLA: 1 = uguale, 0.5 = metà velocità
# colore: colore dell'anteprima 3D, in esadecimale tra virgolette
# descrizione: testo mostrato nella pagina (facoltativo)
# Il primo materiale è quello proposto di default.
materiali:
  - nome: PLA
    descrizione: "Facile, preciso e con finitura pulita. Ideale per prototipi, modellini e oggetti d'arredo."
    densita: 1.24
    prezzo_kg: 25
    velocita: 1.0
    colore: "#E9E4DA"
  - nome: PETG
    descrizione: "Più resistente e un po' flessibile, sopporta meglio umidità e calore. Adatto a pezzi funzionali."
    densita: 1.27
    prezzo_kg: 28
    velocita: 0.9
    colore: "#7FB3CF"
  - nome: ABS
    descrizione: "Robusto e lavorabile dopo la stampa, regge temperature più alte del PLA."
    densita: 1.04
    prezzo_kg: 27
    velocita: 0.9
    colore: "#A9AEB6"
  - nome: ASA (per esterni)
    descrizione: "Simile all'ABS ma resiste ai raggi UV: la scelta giusta per i pezzi che stanno all'aperto."
    densita: 1.07
    prezzo_kg: 32
    velocita: 0.9
    colore: "#D8CDB4"
  - nome: TPU (flessibile)
    descrizione: "Gommoso ed elastico: guarnizioni, protezioni, piedini antiscivolo."
    densita: 1.21
    prezzo_kg: 40
    velocita: 0.45
    colore: "#E5673E"

# ---------- Qualità di stampa ----------
# strato_mm: altezza dello strato
# portata_mm3s: volume medio stampato al secondo, spostamenti inclusi.
#   Più è alta, più la stima del tempo è breve: calibrala confrontando
#   qualche stima con il tempo indicato dal tuo slicer.
qualita:
  - nome: Bozza
    strato_mm: 0.28
    portata_mm3s: 9
  - nome: Standard
    strato_mm: 0.20
    portata_mm3s: 6
    predefinita: true
  - nome: Fine
    strato_mm: 0.12
    portata_mm3s: 3.5

# ---------- Stampante e limiti ----------
area_stampa_mm: [256, 256, 256]   # X, Y, Z; usata solo se la lista "stampanti" è vuota
max_file: 20                      # file per preventivo
max_mb_per_file: 80               # dimensione massima di ogni file

# ---------- Stima di peso e tempo ----------
spessore_pareti_mm: 0.8           # pareti e strati pieni (2 perimetri da 0.4 mm)
supporti_materiale_percento: 15   # materiale in più per i file con supporti
supporti_tempo_percento: 10       # tempo in più per i file con supporti
riscaldamento_minuti: 5           # per ordine
cambio_strato_secondi: 2

# ---------- Stampanti ----------
# Il cliente sceglie la stampante da un menu e il simulatore usa i suoi parametri.
# Tieni solo le stampanti che possiedi davvero e correggi i valori: questi sono esempi.
#   area_stampa_mm: X, Y, Z in mm (i modelli più grandi vengono segnalati)
#   costo_orario:   € per ora di stampa su questa macchina (energia, usura, ammortamento)
#   velocita:       quanto è veloce rispetto alla portata delle qualità (1 = uguale, 1.5 = 50% più veloce)
#   chiusa:         true se la stampante è chiusa (adatta ad ABS e ASA)
#   materiali:      materiali che può stampare, con i nomi usati sopra (basta la prima parola).
#                   Se ometti la riga, la stampante accetta tutti i materiali.
#   note:           testo facoltativo mostrato sotto il menu
#   predefinita:    true per la stampante proposta all'apertura della pagina
# Per togliere il menu: stampanti: []
stampanti:
  - nome: Bambu Lab A1 mini
    area_stampa_mm: [180, 180, 180]
    costo_orario: 1.20
    velocita: 1.4
    chiusa: false
    materiali: [PLA, PETG, TPU]
    note: "Ideale per pezzi piccoli e dettagliati."
  - nome: Bambu Lab A1
    area_stampa_mm: [256, 256, 256]
    costo_orario: 1.50
    velocita: 1.4
    chiusa: false
    materiali: [PLA, PETG, TPU]
    predefinita: true
  - nome: Bambu Lab P1S
    area_stampa_mm: [256, 256, 256]
    costo_orario: 1.80
    velocita: 1.5
    chiusa: true
    note: "Stampante chiusa: adatta anche ad ABS e ASA."
  - nome: Prusa MK4S
    area_stampa_mm: [250, 210, 220]
    costo_orario: 1.60
    velocita: 1.2
    chiusa: false
    materiali: [PLA, PETG, TPU]
  - nome: Creality Ender 3 V3 SE
    area_stampa_mm: [220, 220, 250]
    costo_orario: 1.00
    velocita: 1.0
    chiusa: false
    materiali: [PLA, PETG]
